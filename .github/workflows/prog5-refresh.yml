name: Prog5 daily refresh

# Unattended writer for the deployed dashboard. It runs the same
# prog5.refresh.refresh pipeline the CLI uses against the Neon database the
# Vercel app reads, so the served card stops drifting one trading day behind.
# The job refuses to run when the DATABASE_URL secret is missing, because the
# pipeline would otherwise write to the runner's throwaway SQLite file and
# report success while the deployed site stayed frozen.
on:
  schedule:
    # Two slots per trading day. Yahoo's EOD update for IDX names usually
    # lands by 17:30 WIB but sometimes drifts later, so the evening slot
    # re-runs the pipeline and fills any gap. The concurrency group keeps
    # the two writers from overlapping.
    - cron: "45 10 * * 1-5"  # 17:45 WIB, after the afternoon host tick
    - cron: "0 14 * * 1-5"   # 21:00 WIB, catches late Yahoo EOD updates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prog5-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Only the deployment repository holds the models, research inputs, and
    # the DATABASE_URL secret; other repositories skip the scheduled job. A
    # manual run stays available everywhere so a misconfiguration is visible.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'Gluttony6547/pokonyaLULUS'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KERAS_BACKEND: torch
      PYTHONPATH: ${{ github.workspace }}/Prog5
      PROG5_ARTIFACT_DIR: ${{ github.workspace }}/models
      PROG5_RESEARCH_DATA_DIR: ${{ github.workspace }}/Prog5/data/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Prog5/requirements.txt

      - name: Refuse to run without the Neon connection string
        env:
          CONNECTION: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$CONNECTION" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Neon pooled connection string), otherwise the refresh only writes to the runner."
            exit 1
          fi

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-torch-cpu.txt
          python -m pip install -r Prog5/requirements.txt

      - name: Refresh all ten tickers through the one pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m prog5.cli refresh --symbols ADRO,ANTM,BMRI,BNGA,EXCL,INCO,INKP,MEDC,PGAS,TLKM
