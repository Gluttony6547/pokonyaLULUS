name: Prog5 daily refresh

# Unattended writer for the deployed dashboard. It runs the same
# prog5.refresh.refresh pipeline the CLI uses against the Neon database the
# Vercel app reads. GitHub drops scheduled runs under load, so the evening is
# covered by a dense window of cheap attempts instead of one or two slots:
# each attempt first compares the deployed site with Yahoo and skips the model
# install once the two agree, and the last step fails the run when the site
# still trails Yahoo after the pipeline has run.
on:
  schedule:
    - cron: "22 1 * * 1-5"       # 08:22 WIB repair pass for a missed evening
    - cron: "7,37 10-16 * * 1-5" # 17:07-23:37 WIB, every 30 min off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prog5-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Only the deployment repository holds the models, research inputs, and
    # the DATABASE_URL secret; other repositories skip the scheduled job. A
    # manual run stays available everywhere so a misconfiguration is visible.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'Gluttony6547/pokonyaLULUS'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KERAS_BACKEND: torch
      PYTHONPATH: ${{ github.workspace }}/Prog5
      PROG5_ARTIFACT_DIR: ${{ github.workspace }}/models
      PROG5_RESEARCH_DATA_DIR: ${{ github.workspace }}/Prog5/data/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Prog5/requirements.txt

      - name: Decide whether a refresh is needed
        id: due
        # A manual dispatch always refreshes; a scheduled attempt skips the
        # install when the site already matches Yahoo's completed sessions.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || ! python Prog5/scripts/check_site_freshness.py; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to refresh without the Neon connection string
        if: steps.due.outputs.stale == 'true'
        env:
          CONNECTION: ${{ secrets.DATABASE_URL }}
        # Without the secret the pipeline would write to the runner's throwaway
        # SQLite file and report success while the deployed site stayed frozen.
        run: |
          if [ -z "$CONNECTION" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Neon pooled connection string), otherwise the refresh only writes to the runner."
            exit 1
          fi

      - name: Install runtime dependencies
        if: steps.due.outputs.stale == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-torch-cpu.txt
          python -m pip install -r Prog5/requirements.txt

      - name: Refresh all ten tickers through the one pipeline
        if: steps.due.outputs.stale == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m prog5.cli refresh --symbols ADRO,ANTM,BMRI,BNGA,EXCL,INCO,INKP,MEDC,PGAS,TLKM

      - name: Fail when the site still trails Yahoo
        run: python Prog5/scripts/check_site_freshness.py
