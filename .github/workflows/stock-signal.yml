name: Stock Signal CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r requirements-training.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q test_suite.py
      - run: python training_engine.py

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag stock-signal-dashboard:ci .
      - run: docker build --file Dockerfile.vercel --tag stock-signal-dashboard:vercel-ci .
