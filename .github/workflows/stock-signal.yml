name: Stock Signal CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-torch-cpu.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r requirements-training.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q test_suite.py
      - run: python training_engine.py

  prog5:
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: torch
      PYTHONPATH: ${{ github.workspace }}/Prog5
      PROG5_ARTIFACT_DIR: ${{ github.workspace }}/models
      PROG5_RESEARCH_DATA_DIR: ${{ github.workspace }}/Prog5/data/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Prog5/requirements-dev.txt
      - run: python -m pip install -r requirements-torch-cpu.txt
      - run: python -m pip install -r Prog5/requirements-dev.txt
      - run: python -m compileall -q Prog5/prog5
      - run: python -m pytest -q Prog5/tests
      - run: python -m prog5.cli inventory
      - run: python -m prog5.cli verify

  container:
    runs-on: ubuntu-latest
    needs: [test, prog5]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag stock-signal-dashboard:ci .
      - run: docker build --file Dockerfile.vercel --tag stock-signal-dashboard:vercel-ci .
